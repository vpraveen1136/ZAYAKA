<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9531E"/>
      <stop offset="100%" stop-color="#B23B08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5A260B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#E6DAC8" stroke-width="4"/>

  <!-- Main emblem: Artisanal Cooking Pot / Degchi with Star Anise / Aromatics -->
  <g filter="url(#shadow)" transform="translate(48, 40)">
    <!-- Aroma Steam waves -->
    <path d="M148,80 C138,50 158,30 148,10" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M208,70 C198,35 220,15 208,-5" fill="none" stroke="url(#terracotta)" stroke-width="14" stroke-linecap="round"/>
    <path d="M268,80 C258,50 278,30 268,10" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

    <!-- Pot Lid / Dome -->
    <path d="M88,140 C88,110 328,110 328,140 L340,165 C340,172 334,178 326,178 L90,178 C82,178 76,172 76,165 Z" fill="url(#gold)"/>
    <circle cx="208" cy="106" r="18" fill="url(#terracotta)"/>

    <!-- Pot Base -->
    <path d="M82,192 L334,192 C342,192 348,198 346,206 L324,310 C316,350 272,374 208,374 C144,374 100,350 92,310 L70,206 C68,198 74,192 82,192 Z" fill="url(#terracotta)"/>

    <!-- Pot rim highlight -->
    <ellipse cx="208" cy="192" rx="134" ry="12" fill="#E26533"/>

    <!-- Decorative brass handles -->
    <path d="M72,216 C50,216 46,252 70,256" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <path d="M344,216 C366,216 370,252 346,256" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>

    <!-- Center Emblem: 'Z' monogram in Indian calligraphic style -->
    <path d="M180,240 L236,240 C242,240 246,244 242,250 L188,312 L244,312" fill="none" stroke="#FFFDF9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
